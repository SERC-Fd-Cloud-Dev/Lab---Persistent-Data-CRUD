<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 650" role="img" aria-labelledby="title desc">
<title id="title">Simple cache aside flow</title><desc id="desc">GET checks an integer id in a local dictionary. A hit returns its response snapshot. A miss queries the database and stores the result. A committed PUT or DELETE removes that id. Missing records return 404 and are not cached.</desc>
<style>text{font-family:Arial,sans-serif;fill:#141414;font-size:22px}.node{fill:#E1D4DA;stroke:#4A1830;stroke-width:2}.dark{fill:#4A1830}.white{fill:white}.line{fill:none;stroke:#4A1830;stroke-width:3;marker-end:url(#a)}.pink{stroke:#E0007A;stroke-width:4}.small{font-size:19px}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#4A1830"/></marker></defs>
<rect x="340" y="20" width="380" height="70" rx="7" class="dark" fill="#4A1830"/><text x="530" y="64" text-anchor="middle" class="white" font-family="Arial, sans-serif" font-size="22" fill="#FFFFFF">GET equipment by id</text>
<rect x="340" y="145" width="380" height="80" rx="7" class="node" fill="#E1D4DA" stroke="#4A1830" stroke-width="2"/><text x="530" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#141414">Key in local dictionary?</text>
<rect x="35" y="315" width="360" height="80" rx="7" class="node" fill="#E1D4DA" stroke="#4A1830" stroke-width="2"/><text x="215" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#141414">Return cached snapshot</text>
<rect x="620" y="315" width="405" height="80" rx="7" class="node" fill="#E1D4DA" stroke="#4A1830" stroke-width="2"/><text x="822" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#141414">Query authoritative database</text>
<rect x="620" y="455" width="405" height="80" rx="7" class="node" fill="#E1D4DA" stroke="#4A1830" stroke-width="2"/><text x="822" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#141414">Store response snapshot</text><text x="822" y="518" text-anchor="middle" class="small" font-family="Arial, sans-serif" font-size="19" fill="#141414">Then return fresh data</text>
<path d="M530 90V133M405 225V270H215V303M655 225V270H822V303M822 395V443" class="line" fill="none" stroke="#4A1830" stroke-width="3" marker-end="url(#a)"/>
<text x="260" y="260" class="small" font-family="Arial, sans-serif" font-size="19" fill="#141414">Hit</text><text x="735" y="260" class="small" font-family="Arial, sans-serif" font-size="19" fill="#141414">Miss</text>
<text x="530" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#141414">After committed PUT or DELETE: remove the affected cache key.</text>
<text x="530" y="630" text-anchor="middle" class="small" font-family="Arial, sans-serif" font-size="19" fill="#141414">No record: return 404. This example does not cache missing records.</text></svg>