<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
<title id="title">Persistent request path</title><desc id="desc">A client sends HTTP to a FastAPI route. The route delegates data access to a repository using a request Session. SQLAlchemy executes queries and transactions against the database. The response returns through the route.</desc>
<style>text{font-family:Arial,sans-serif;fill:#141414;font-size:23px}.box{fill:#E1D4DA;stroke:#4A1830;stroke-width:2}.dark{fill:#4A1830}.white{fill:#fff}.arrow{stroke:#E0007A;stroke-width:4;fill:none;marker-end:url(#a)}.small{font-size:18px}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#E0007A"/></marker></defs>
<rect x="25" y="90" width="205" height="105" rx="8" class="box" fill="#E1D4DA" stroke="#4A1830" stroke-width="2"/><text x="127" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#141414">Client</text><text x="127" y="165" text-anchor="middle" class="small" font-family="Arial, sans-serif" font-size="19" fill="#141414">HTTP request</text>
<rect x="300" y="90" width="210" height="105" rx="8" class="box" fill="#E1D4DA" stroke="#4A1830" stroke-width="2"/><text x="405" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#141414">FastAPI route</text><text x="405" y="165" text-anchor="middle" class="small" font-family="Arial, sans-serif" font-size="19" fill="#141414">HTTP response rules</text>
<rect x="580" y="90" width="235" height="105" rx="8" class="box" fill="#E1D4DA" stroke="#4A1830" stroke-width="2"/><text x="697" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#141414">Repository</text><text x="697" y="163" text-anchor="middle" class="small" font-family="Arial, sans-serif" font-size="19" fill="#141414">Request Session</text>
<rect x="885" y="90" width="210" height="105" rx="8" class="dark" fill="#4A1830"/><text x="990" y="135" text-anchor="middle" class="white" font-family="Arial, sans-serif" font-size="22" fill="#FFFFFF">Database</text><text x="990" y="165" text-anchor="middle" class="white small" font-family="Arial, sans-serif" font-size="19" fill="#FFFFFF">Committed records</text>
<path d="M230 140H287M510 140H567M815 140H872" class="arrow" fill="none" stroke="#E0007A" stroke-width="3" marker-end="url(#a)"/>
<text x="560" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#141414">SQLAlchemy coordinates mapped objects, queries and transactions.</text></svg>